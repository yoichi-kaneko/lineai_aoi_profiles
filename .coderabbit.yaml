# yaml-language-server: $schema=https://www.coderabbit.ai/integrations/schema.v2.json
language: "ja"

reviews:
  path_filters:
    - "!node_modules/**"
    - "!functions/dist/**"
    - "!tmp/**"
    - "!pnpm-lock.yaml"
  path_instructions:
    - path: "**/*"
      instructions: |
        レビューコメントと説明は日本語で書いてください。
        AGENTS.md の「Code Review Rules」と docs/agent/review-policy.md を読み、共通の重点観点・対象外・採否基準に従ってください。
  tools:
    # Oxlint (.oxlintrc.json) は Biome が無効の場合のみ動作するため無効化
    biome:
      enabled: false
