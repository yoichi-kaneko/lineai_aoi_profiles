name: test

# プッシュのたびに test/ 配下の vitest を実行する。
# いずれもネットワークへ出ない純関数のテストのため、シークレット（.env）は不要。
on:
  push:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # pnpm のバージョンは package.json の packageManager（pnpm@10.x）に従う
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test
